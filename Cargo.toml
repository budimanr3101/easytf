[package]
name = "easytf"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal workspace for generating Terraform projects"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
hcl-rs = "0.19"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true

